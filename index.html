			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;

			this.makeImpl(true, i);

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);

		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}

		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;

	setupTypeInfo : function(test, maskPattern) {

		var bits = QRUtil.getBCHTypeInfo(data);

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

  await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-database-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);

    send:a=>base.child('actions').push(a),

}

function hostMain(opt={}){
  const EMB=!!opt.mem;
  if(!EMB)document.documentElement.classList.add('tv');
  const A='ACDEFGHJKLMNPQRTUVWXY';const given=(params.get('host')||'').toUpperCase();
  const code=EMB?'TEST':given.length===4?given:Array.from({length:4},()=>A[Math.floor(rnd()*A.length)]).join('');
  if(!EMB&&given!==code){const u=new URL(location.href);u.searchParams.set('host',code);history.replaceState(null,'',u)}
  const joinURL=(()=>{const u=new URL(location.href);u.search='';u.searchParams.set('room',code);if(params.get('local')==='1')u.searchParams.set('local','1');return u.toString()})();
  const SAVE='saigo-host-'+code;
  let net=null;
  const S={code,phase:'lobby',players:[],round:0,prices:Array(7).fill(C.start),hist:[Array(7).fill(C.start)],gameNo:0,decks:null,deck:null};
  /* 読み込み直したときは、保存しておいた状態から再開する */

  const P=()=>S.players;
  const POPS=()=>CARDS.map(c=>c.pop);
  const fxOf=p=>(p.a||0)+(p.hon||0)*C.hon+(p.tb||0)+(p.bet||0)-(p.pen||0);
  /* 注目の1人:一周するまでは開始時に決めた順、そのあとは首位 */
  const scoreNow=p=>fxOf(p)+Math.max(...p.hand.map(c=>S.prices[c]));

  function addEv(pr,ev){if(ev.e==='crash'){let m=0;pr.forEach((x,i)=>{if(x>pr[m])m=i});pr[m]-=50}else if(ev.e==='cheap'){let m=0;pr.forEach((x,i)=>{if(x<pr[m])m=i});pr[m]+=40}else for(const[c,d]of Object.entries(ev.e))pr[c]+=d;for(let i=0;i<7;i++)pr[i]=Math.max(C.floor,pr[i])}
  /* 出来事:札が毎回変わるので、その回の札から選んで作る */
  function makeEvents(){const sl=shuffle([0,1,2,3,4,5,6]);const T=[
    ()=>{const x=sl.pop();return{n:`「${CARDS[x].n}」ブーム`,e:{[x]:40}}},
    ()=>{const x=sl.pop();return{n:`「${CARDS[x].n}」離れ`,e:{[x]:-30}}},
    ()=>{const x=sl.pop(),y=sl.pop();return{n:`「${CARDS[x].n}」より「${CARDS[y].n}」の時代`,e:{[x]:-30,[y]:30}}},
    ()=>({n:'バブル崩壊',e:'crash'}),
    ()=>({n:'見直し買い',e:'cheap'})];
    return shuffle(T).slice(0,2).map(f=>f())}
  const expPrices=()=>{const e=[...S.prices],nx=C.evAt.indexOf(S.round+1);if(nx>=0)addEv(e,S.events[nx]);return e};
  const cpuDiscard=(p,ex)=>{let b=null,bu=1e9;for(const c of p.hand){const u=(1-p.g)*p.v[c]+p.g*ex[c]/200+gauss()*.03;if(u<bu){bu=u;b=c}}return b};
  const cpuGuess=(t,ex,keep)=>{const t0=P()[t],base=t0.cpu?t0.v:POPS();let b=null,bu=keep?-1e9:1e9;for(const c of t0.hand){const u=.5*(base[c]+gauss()*.3)+.5*ex[c]/200;if(keep?u>bu:u<bu){bu=u;b=c}}return b};
  const newPlayer=(id,name,cpu)=>({id,name,cpu});
  function resetPlayer(p){const v=POPS().map(x=>x+gauss()*.3);Object.assign(p,{v,g:rnd(),rank:p.cpu?[...v.keys()].sort((a,b)=>v[b]-v[a]):[],autoRank:false,hand:[0,1,2,3,4,5,6],disc:[],maj:0,hon:0,tb:0,pen:0,timeouts:0,fool:0,spotN:0,a:0,bet:0,hits:0,targeted:0,greedy:0,notes:[],pick:null,guess:null,hit:false,to:false,final:null,gdrop:null})}

    S.order=shuffle(P().map((p,i)=>i));

  }
  function checkRanking(){if(P().every(p=>p.rank.length===7))startRound();else pub()}
  function startRound(){
    S.round++;const ei=C.evAt.indexOf(S.round);S.firedEv=null;
    if(ei>=0){addEv(S.prices,S.events[ei]);S.firedEv=S.events[ei];S.hist.push([...S.prices])}

  /* 時間切れ:並べ終えていない人は順位を自動で、手放していない人はランダムに。どちらも減点 */
  function timeoutRanking(){P().forEach(p=>{if(p.rank.length<7){p.rank=shuffle([0,1,2,3,4,5,6]);p.autoRank=true;p.pen+=C.pen;p.timeouts++}});startRound()}

      <h2>確定点の順位</h2>${standHTML(PL,V.dfx)}

      if(V.cer<0)h=`<div class="split"><div>${mk(7,'終局')}<h1>${win.map(x=>esc(PL[x.i].name)).join('さんと')}さんの勝ち</h1>${R.tie?'<p class="sub">合計が同点のため、予想の得点が多い人を上にしています。</p>':''}${table}
        <button class="go" data-act="nextcert">本性証券を発行する</button></div><div>${board(V.prices,V.frozen,V.hist,'最終相場')}</div></div>`;
      else if(V.cer<n){const i=R.order[V.cer];h=`${mk(7,`本性証券の発行 ${V.cer+1}/${n}`)}<div class="hero">${certHTML(R.certs[i],PL[i].name,PL)}</div><div class="hero"><button class="go" data-act="nextcert">${V.cer<n-1?'次の証券を発行':'全員の証券を並べる'}</button></div>`}
      else h=`${mk(7,'終局')}<h1>${win.map(x=>esc(PL[x.i].name)).join('さんと')}さんの勝ち</h1>${table}<div class="row"><button class="plain" data-act="again">同じ顔ぶれでもう一度</button></div>
        <h2>本性証券</h2><div class="certs">${R.certs.map((d,i)=>certHTML(d,PL[i].name,PL)).join('')}</div>`;
    }
    paint(h,ph+'|'+V.round+'|'+(V.j??'')+'|'+(V.cer??'')+'|'+(V.revStep??''));
  }
  if(!EMB){app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(acts[b.dataset.act]){SFX.play('decide');acts[b.dataset.act]();window.scrollTo(0,0)}});render(view())}
  connect(code,opt.mem).then(n=>{net=n;n.onAction(onAction);pub()}).catch(()=>{app.insertAdjacentHTML('afterbegin','<p class="mode">通信の準備に失敗しました。設定と通信環境を確認して、ページを読み込み直してください。</p>')});
  if(restored&&S.phase!=='lobby')setTimeout(()=>app.insertAdjacentHTML('afterbegin','<p class="mode">保存していた状態から再開しました。</p>'),50);
}

/* ================= スマホ(参加者) ================= */
function playerMain(code,opt={}){
  const TEST=!!opt.mem;
  let pid=null;try{pid=TEST?null:sessionStorage.getItem('saigo-pid')}catch(e){}
  if(!pid){pid='p'+Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36);try{if(!TEST)sessionStorage.setItem('saigo-pid',pid)}catch(e){}}
  let myName='';try{myName=localStorage.getItem('saigo-name')||''}catch(e){}
  let net=null,V=null,joined=false,sel={k:'',d:null,g:null,rank:[],sent:null};

    let h='';const me=V?V.players.findIndex(p=>p.id===pid):-1,M=me>=0?V.players[me]:null,LEAD=!!V&&V.leader===pid;

    const nextNote=LEAD?'':`<p class="sub" style="margin-top:16px">進行役が次へ進めます。</p>`;
    const head=TEST?'ひとりで試す':'部屋 '+esc(code);
    const wait=(t,s='')=>`<div class="wait"><div class="back">${backArt}</div><p class="who">${t}</p>${s?`<p class="sub">${s}</p>`:''}</div>`;

      <button class="go" data-act="join">${TEST?'始める':'参加する'}</button>${!V&&!TEST?'<p class="sub" style="margin-top:14px">テレビとつないでいます。</p>':''}${TEST?'':modeNote()}`;
    }else{
      const ph=V.phase,key=ph+'|'+V.round+'|'+(V.j??'')+'|'+(V.cer??'');if(sel.k!==key){sel={k:key,d:null,g:null,rank:[],sent:null}}
      if(ph==='lobby'){
        if(LEAD){const n=V.players.length;h=`${mk(null,head)}<h1>参加者 <span class="num">${n}/${C.max}</span>人</h1><p class="sub">あなたが進行役です。足りない人数はCPUで補えます。</p>${people()}
          <div class="row"><button class="plain" data-act="ctl" data-op="cpu"${n>=C.max?' disabled':''}>CPUを加える</button><button class="plain" data-act="ctl" data-op="uncpu"${V.players.some(p=>p.cpu)?'':' disabled'}>CPUを減らす</button></div>
          <button class="go" data-act="ctl" data-op="start"${n<C.min?' disabled':''}>${n<C.min?`あと${C.min-n}人で始められます`:'この顔ぶれで始める'}</button>`}
        else h=wait(`${esc(M.name)}さん`,'進行役が始めるのを待っています。')+people();
      }else if(ph==='ranking'){
        if(M.rankDone||sel.sent)h=wait('並べ終えました',`ほかの人を待っています。残り ${cd(V.deadline)}`);
        else{const t=sel.rank;h=`${mk(0,'はじめる前に')}<p class="timeleft">残り ${cd(V.deadline)}</p><h1>大事な順に、7枚を押す</h1><p class="sub">いちばん大事なものから順に押してください。順位は誰にも見せません。</p>
          ${first?guide(['大事なものから順に、7枚すべてを押す',`ゲーム中、この順位でいちばん下の札から手放すと、1回ごとに本音点+${C.hon}`,`${tlen(C.rankSec)}を過ぎると順位が自動で決まり、−${C.pen}点`]):`<p class="hint">この順位でいちばん下の札から手放すと、1回ごとに本音点+${C.hon}。最後の診断にも使います。</p>`}
          <div class="hand" style="--n:4">${CARDS.map((c,i)=>pickBtn(i,`data-act="rk" data-c="${i}"`,t.includes(i),t.includes(i)?`<span class="ord num">${t.indexOf(i)+1}</span>`:'')).join('')}</div>
          <div class="row" style="margin-top:18px"><button class="plain" data-act="rkreset"${t.length?'':' disabled'}>やり直す</button><span class="sub num">${t.length}/7枚</span></div>
          <button class="go" data-act="rkok"${t.length<7?' disabled':''}>この順で決める</button>`}
      }else if(ph==='turn'){
        const isSpot=me===V.spot,tp=V.players[V.spot];

        else{const hon=honestOf(M.hand);h=`${mk(V.round,kan[V.round]+'巡目')}${V.firedEv?`<div class="notice" style="margin-top:0"><b>「${esc(V.firedEv.n)}」</b>が起きました。${esc(V.firedEv.t)}</div>`:''}${isSpot?`<div class="notice" style="margin-top:0"><b>今巡の注目は、あなたです。</b>全員があなたの手放す札を予想しています。全員を外させれば+${C.foolAll}点、半数より多く外させれば+${C.foolHalf}点。</div>`:''}
          ${first&&V.round===1?`<h2 style="margin-top:0">いまやること</h2>${guide(isSpot?[`手放す札を1枚選ぶ。「本音」の札なら+${C.hon}点`,'みんなの予想を外させると点が入る',`${tlen(C.turnSec)}以内に「決める」を押す`]:[`手放す札を1枚選ぶ。「本音」の札なら+${C.hon}点`,`${esc(tp.name)}さんが手放す札を予想する。当たれば+${C.a}点`,`${tlen(C.turnSec)}以内に「決める」を押す。過ぎるとランダムに手放され、−${C.pen}点`])}`:''}
          <h1>${isSpot?'手放す札を選ぶ':'1. 手放す札を選ぶ'}</h1><p class="sub">最後に残した1枚の相場が得点になります。札の右上はあなたの順位です。</p>
          <div class="hand" style="--n:${cols(M.hand.length)}">${M.hand.map(c=>myCard(c,`data-act="pd" data-c="${c}"`,sel.d===c,V.prices[c],c===hon)).join('')}</div>
          ${sel.d===null?`<p class="hint off">「本音」と書いた札を手放すと、本音点+${C.hon}。</p>`:`<p class="hint">「${CARDS[sel.d].n}」を手放す。${sel.d===hon?`本音どおりなので+${C.hon}点。`:'本音とは違う札なので、本音点はなし。'}この札の相場は上がります。</p>`}
          ${isSpot?'':`<h2>2. 注目の${esc(tp.name)}さんが手放す札を予想</h2><p class="sub">全員が同じ人を予想しています。当たれば+${C.a}点。</p><div class="hand" style="--n:${cols(tp.hand.length)}">${tp.hand.map(c=>pickBtn(c,`data-act="pg" data-c="${c}"`,sel.g===c)).join('')}</div>`}
          ${V.nextEv?`<div class="notice">${kan[V.round+1]}巡目の前に<b>「${esc(V.nextEv.n)}」</b>が起きます。${esc(V.nextEv.t)}</div>`:''}
          <button class="go" data-act="pok"${sel.d===null||(!isSpot&&sel.g===null)?' disabled':''}>${sel.d===null?'手放す札を選んでください':isSpot?'これで決める':sel.g===null?'予想を選んでください':'この2つで決める'}</button>${TEST?`<h2>値動き</h2>${pubBoard(V,'')}`:''}`}
      }else if(ph==='reveal'){

        else{const x=X.all[me],myG=X.guesses[me];

  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,c=b.dataset.c===undefined?null:+b.dataset.c;
    SFX.play(['rk','pd','pg'].includes(a)?'tap':'decide');
    if(a==='ctl'){send({type:'ctl',op:b.dataset.op});window.scrollTo(0,0);return}
    if(a==='join'){const n=document.getElementById('nm').value.trim();if(!n){document.getElementById('nm').focus();return}myName=n;try{localStorage.setItem('saigo-name',n)}catch(e){}joined=true;send({type:'join',name:n});return}
    if(a==='rk'){if(!sel.rank.includes(c))sel.rank.push(c);render();return}
    if(a==='rkreset'){sel.rank=[];render();return}
    if(a==='rkok'){sel.sent=true;myRank=sel.rank.slice();try{if(!TEST)sessionStorage.setItem('saigo-rank',JSON.stringify(myRank))}catch(e){}send({type:'rank',order:sel.rank})}
    if(a==='pd'){sel.d=c;render();return}
    if(a==='pg'){sel.g=c;render();return}
    if(a==='pok'){sel.sent={pick:sel.d,guess:sel.g};send({type:'turn',pick:sel.d,guess:sel.g})}
    if(a==='bet'){sel.sent=c;send({type:'bet',card:c})}
    if(a==='nobet'){sel.sent=-1;send({type:'bet',card:null})}
    if(a==='keep'){sel.sent=c;send({type:'keep',card:c})}
    render();window.scrollTo(0,0)});
  render();
  let pc=null;
  function playerCues(V){const me=V.players.findIndex(p=>p.id===pid),p=pc;pc={ph:V.phase,r:V.round,j:V.j,cer:V.cer,rs:V.revStep,n:V.players.length};if(!p||me<0)return;
    const changed=V.phase!==p.ph||V.round!==p.r||V.j!==p.j;
    if(changed){
      if(TEST){if(V.phase==='ranking'||V.phase==='turn'||V.phase==='final')SFX.play('hyoshigi');if(V.phase==='turn'&&V.firedEv)SFX.play('bell',.45)}
      if(V.phase==='final-reveal'){const b=(V.lastBets||[]).find(y=>y.i===me);SFX.play('stamp');if(b)SFX.play(b.w?'coin':'miss',.3);else if(me===V.j&&V.gHonest)SFX.play('rin',.3)}
      if(V.phase==='results')SFX.play(TEST?'fanfare':'reveal');
      return}
    if(V.phase==='reveal'&&V.revStep===1&&p.rs===0){const X=V.reveal,x=X.all[me],g=X.guesses[me];SFX.play('reveal');if(x.honest)SFX.play('rin',.25);if(g&&g.hit||me===X.spot&&X.bonus)SFX.play('coin',.55);if(x.to)SFX.play('miss',.4)}
    if(V.phase==='results'&&V.cer!==p.cer&&V.results){const t=V.results.order.indexOf(me);if(TEST&&V.cer>=0&&V.cer<V.players.length||!TEST&&V.cer===t)SFX.play('stamp',.7)}
    if(V.phase==='lobby'&&TEST&&V.players.length>p.n)SFX.play('join');
  }
  /* 残り時間の音:自分がまだ決めていないときだけ鳴らす */
  onSec=s=>{if(!V)return;const me=V.players.findIndex(p=>p.id===pid);if(me<0)return;const M=V.players[me];
    const pending=V.phase==='ranking'&&!M.rankDone&&!sel.sent||V.phase==='turn'&&!M.submitted&&!sel.sent||V.phase==='final'&&sel.sent===null&&(me===V.j?!V.keepDone:!V.betDone.includes(me));
    if(TEST&&['ranking','turn','final'].includes(V.phase)&&s<=10&&s>0||pending&&(s===30||s<=5&&s>0))SFX.play(s<=3?'tickHi':'tick')};
  connect(code,opt.mem).then(n=>{net=n;n.onState(s=>{
    if(s.now)OFF=s.now-Date.now();
    if(s.deck)setDeck(s.deck);
    if(V&&s.phase==='ranking'&&V.phase!=='ranking'){myRank=null;try{sessionStorage.removeItem('saigo-rank')}catch(e){}}
    playerCues(s);V=s;window.__pV=V;if(joined||V.players.some(p=>p.id===pid))joined=true;render()})}).catch(()=>{app.insertAdjacentHTML('afterbegin','<p class="mode">通信の準備に失敗しました。通信環境を確認して、ページを読み込み直してください。</p>')});
}

/* ================= 入口 ================= */
function landing(){
  const go=u=>{location.href=u};
  app.innerHTML=`<div class="screen"><div class="fan" aria-hidden="true">${CARDS.map((c,i)=>card(i)).join('')}</div><h1>最後の一枚</h1><p class="sub">7枚の価値観を1枚ずつ手放し、最後に残った1枚で本性を診断します。3〜7人で遊べます。</p>
  <button class="go" data-act="host">テレビで部屋を作る</button>
  <h2>スマホで参加</h2><label for="cd">部屋コード(4文字)</label><input id="cd" class="field code" maxlength="4" autocomplete="off" autocapitalize="characters"><button class="plain" data-act="join" style="margin-top:12px">参加する</button>
  <h2>ひとりで試す</h2><p class="sub">CPUを相手に、テレビも通信も使わずに遊べます。</p><button class="plain" data-act="test">CPUと遊ぶ</button>${modeNote()}</div>`;
  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const u=new URL(location.href);u.search='';
    if(b.dataset.act==='host'){u.searchParams.set('host','new');go(u)}
    else if(b.dataset.act==='test'){u.searchParams.set('test','1');go(u)}
    else{const v=document.getElementById('cd').value.trim().toUpperCase();if(v.length!==4){document.getElementById('cd').focus();return}u.searchParams.set('room',v);go(u)}});
}
const fanFix=()=>document.querySelectorAll('.fan .cd').forEach((el,i)=>{el.style.transform=`rotate(${(i-3)*11}deg)`});
new MutationObserver(fanFix).observe(app,{childList:true,subtree:true});
if(params.get('test')){const mem=memTransport();hostMain({mem});playerMain('TEST',{mem})}
else if(params.get('host'))hostMain();else if(params.get('room'))playerMain(params.get('room').toUpperCase().slice(0,4));else landing();
}

</script>
