	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

}};
return{QRCode:R("index"),L:R("QRErrorCorrectLevel")}})();

  const newPlayer=(id,name,cpu)=>({id,name,cpu});
  function resetPlayer(p){const v=POP.map(x=>x+gauss()*.3);Object.assign(p,{v,g:rnd(),rank:p.cpu?[...v.keys()].sort((a,b)=>v[b]-v[a]):[],hand:[0,1,2,3,4,5,6],disc:[],maj:0,a:0,bet:0,hits:0,targeted:0,greedy:0,notes:[],pick:null,guess:null,hit:false,final:null,gdrop:null})}
  function startGame(){
    if(P().length<C.min)return;

    P().forEach(resetPlayer);S.phase='ranking';checkRanking();
  }
  function checkRanking(){if(P().every(p=>p.rank.length===7))startRound();else pub()}

    S.round++;const ei=C.evAt.indexOf(S.round);S.firedEv=null;

    const p=P()[j];p.final=keep;p.gdrop=p.hand.find(c=>c!==keep);
    const honest=[...p.hand].sort((a,b)=>p.rank.indexOf(a)-p.rank.indexOf(b))[0];
    if(keep!==honest){p.greedy++;p.notes.push({k:'greedy',r:6,c:p.gdrop,o:p.rank.indexOf(p.gdrop)+1})}
    S.lastBets=Object.entries(S.bets).filter(([i,c])=>c!==null).map(([i,c])=>{const w=c===keep;P()[i].bet+=w?C.bet:-C.bet;return{i:+i,c,w}});
    S.phase='final-reveal';pub();
  }
  function finish(){
    const low=Math.min(...S.frozen);
    P().forEach(p=>{if(S.frozen[p.final]===low)p.notes.push({k:'low',c:p.final});p.disc.push(p.gdrop)});
    updatePrices(P().map(p=>p.gdrop));
    const rows=P().map((p,i)=>({i,a:p.a,b:S.prices[p.final],bet:p.bet,t:p.a+S.prices[p.final]+p.bet})).sort((x,y)=>y.t-x.t||y.a-x.a);
    const rd=r=>r===6?'最後の二択':kan[r]+'巡目';
    const hi=Math.max(...S.frozen);
    const certs=P().map((p,i)=>{const c=CARDS[p.final],top=p.rank[0],lostAt=p.disc.indexOf(top)+1;
      /* 道のり:当てはまる事実のうち、いちばん珍しいものを一文にする(並びはシミュレーションでの出現率が低い順) */
      const sec=p.rank[1],lost2=p.disc.indexOf(sec)+1,mine=p.a/C.a,hi2=Math.max(...S.frozen),lo2=Math.min(...S.frozen),T=CARDS[top].n;
      const facts=[
        [lost2===1,`二番目に大事だと並べた「${CARDS[sec].n}」を、いきなり一巡目で手放した。`],
        [lostAt>0&&lostAt<=2,`一番と決めたはずの「${T}」を、${rd(lostAt)}であっさり手放した。`],
        [p.maj===0,`一度も、みんなと同じ札を手放さなかった。`],
        [p.targeted>0&&p.hits===0,`${p.targeted}回とも、手の内を読ませなかった。`],
        [mine===0,`人の手放す札を、一度も当てられなかった。`],
        [lostAt===6,`最後の二択で、一番と決めた「${T}」を手放した。`],
        [p.final===top&&p.greedy===0,`一番と決めた「${c.n}」を、一度も本音を曲げずに守り抜いた。`],
        [lostAt>=3&&lostAt<=5,`一番と決めた「${T}」は、${rd(lostAt)}まで粘ってから手放した。`],
        [S.frozen[p.final]===hi2,`最後に残したのは、その時いちばんの高値の札だった。`],
        [S.frozen[p.final]===lo2,`最安値になった「${c.n}」を、最後まで手放さなかった。`],
        [p.hits>=3,`${p.targeted}回のうち${p.hits}回、手の内を読まれた。`],
        [mine>=3,`人の手放す札を、${C.rounds}回のうち${mine}回当てた。`],
        [p.maj>=3,`${C.rounds}回のうち${p.maj}回、みんなと同じ札を手放した。`],
        [p.final===top,`損得で揺れながらも、一番と決めた「${c.n}」だけは守った。`]];
      const story=(facts.find(f=>f[0])||[0,`「${CARDS[p.gdrop].n}」と「${c.n}」で最後まで迷い、「${c.n}」を残した。`])[1];
      const read=p.targeted&&p.hits/p.targeted>=.5;
      const tags=[p.greedy>=3?'計算高い':'本音に正直',p.maj>=3?'周りに合わせる':p.maj===0?'我が道を行く':'周りを見て動く',read?'読まれやすい':'つかみどころがない'];
      return{no:i+1,card:p.final,first:p.disc[0],path:p.disc.slice(),face:S.prices[p.final],story,tags,cpu:p.cpu}});
    S.results={rows,certs,tie:rows.filter(r=>r.t===rows[0].t).length>1};
    S.phase='results';pub();
  }
  function onAction(a){
    if(!a||typeof a!=='object')return;const i=P().findIndex(p=>p.id===a.pid),p=P()[i];
    if(a.type==='join'){const name=String(a.name||'').trim().slice(0,10)||'名無し';
      if(p){p.name=name}else if(S.phase==='lobby'&&P().length<C.max){S.players.push(newPlayer(a.pid,name,false));if(EMB)while(P().length<4)addCpu()}pub();return}
    if(!p||p.cpu)return;
    if(a.type==='ctl'){if(leaderId()===a.pid&&acts[a.op]){acts[a.op]()}return}
    if(a.type==='rank'&&S.phase==='ranking'&&p.rank.length<7){const o=a.order;if(Array.isArray(o)&&o.length===7&&new Set(o).size===7&&o.every(x=>x>=0&&x<7)){p.rank=o.map(Number);checkRanking()}}
    else if(a.type==='turn'&&S.phase==='turn'&&p.pick===null){const t=P()[targetOf(i)];if(p.hand.includes(a.pick)&&t.hand.includes(a.guess)){p.pick=a.pick;p.guess=a.guess;checkTurn()}}
    else if(a.type==='bet'&&S.phase==='final-bet'&&i!==S.gOrder&&!(i in S.bets)){const ch=P()[S.gOrder];S.bets[i]=ch.hand.includes(a.card)?a.card:null;checkBets()}
    else if(a.type==='keep'&&S.phase==='final-choose'&&i===S.gOrder&&p.hand.includes(a.card))decide(i,a.card);
  }
  function leaderId(){const h=P().find(p=>!p.cpu);return h?h.id:null}
  function addCpu(){if(S.phase!=='lobby'||P().length>=C.max)return;let n=1;while(P().some(p=>p.name==='CPU '+n))n++;S.players.push(newPlayer('cpu'+Date.now()+'-'+n,'CPU '+n,true))}
  const acts={
    cpu(){if(S.phase==='lobby'){addCpu();pub()}},
    uncpu(){if(S.phase!=='lobby')return;const k=P().map(p=>p.cpu).lastIndexOf(true);if(k>=0){S.players.splice(k,1);pub()}},
    start(){if(S.phase==='lobby')startGame()},
    next(){if(S.phase==='reveal'){S.round<C.rounds?startRound():startFinal()}else if(S.phase==='final-reveal'){S.gOrder++;openBet()}},
    closebets(){if(S.phase!=='final-bet')return;P().forEach((p,i)=>{if(i!==S.gOrder&&!(i in S.bets))S.bets[i]=null});checkBets()},
    again(){if(S.phase==='results')startGame()}};
  function view(){
    const ph=S.phase,V={code,phase:ph,leader:leaderId(),round:S.round,prices:S.prices,hist:S.hist,
      firedEv:S.firedEv&&ph==='turn'?{n:S.firedEv.n,t:evText(S.firedEv)}:null,
      nextEv:(()=>{if(ph!=='turn')return null;const nx=C.evAt.indexOf(S.round+1);return nx>=0?{n:S.events[nx].n,t:evText(S.events[nx])}:null})(),
      players:P().map((p,i)=>({id:p.id,name:p.name,cpu:p.cpu,hand:p.hand||[],rankDone:(p.rank||[]).length===7,submitted:p.pick!==null&&p.pick!==undefined,target:S.round?targetOf(i):null,a:p.a||0,bet:p.bet||0}))};
    if(ph==='reveal')V.reveal=S.reveal;
    if(ph.startsWith('final')){V.j=S.gOrder;V.frozen=S.frozen;V.betDone=Object.keys(S.bets).map(Number);V.left=S.left;
      if(ph==='final-reveal'){const p=P()[S.gOrder];V.keep=p.final;V.drop=p.gdrop;V.lastBets=S.lastBets}}
    if(ph==='results'){V.results=S.results;V.frozen=S.frozen}
    return V;
  }
  function pub(){const V=view();window.__hostV=V;if(net)net.publish(V);if(!EMB)render(V)}
  function render(V){

    const status=(fn)=>`<ul class="people">${PL.map((p,i)=>`<li><span>${esc(p.name)}</span><span class="st ${fn(p,i)[1]?'ok':''}">${fn(p,i)[0]}</span></li>`).join('')}</ul>`;
    const role=p=>p.id===V.leader?['進行役',1]:p.cpu?['CPU',0]:['',0];
    const evNote=()=>V.nextEv?`<div class="notice">${kan[V.round+1]}巡目の前に<b>「${esc(V.nextEv.n)}」</b>が起きます。${esc(V.nextEv.t)}</div>`:'';

      h=`<div class="split"><div><div class="fan" aria-hidden="true">${CARDS.map((c,i)=>card(i)).join('')}</div><h1>最後の一枚</h1><p class="sub">7枚の価値観を1枚ずつ手放し、最後に残った1枚で本性を診断します。</p>
      <h2>参加者 <span class="num">${PL.length}/${C.max}</span>人</h2>${PL.length?status(role):'<p class="sub">まだ誰もいません。</p>'}
      <div class="row"><button class="plain" data-act="cpu"${PL.length>=C.max?' disabled':''}>CPUを加える</button><button class="plain" data-act="uncpu"${PL.some(p=>p.cpu)?'':' disabled'}>CPUを減らす</button></div>
      <button class="go" data-act="start"${PL.length<C.min?' disabled':''}>${PL.length<C.min?`あと${C.min-PL.length}人で始められます`:'この顔ぶれで始める'}</button>
      <p class="sub" style="margin-top:14px">最初に入った人が進行役です。進行役のスマホからも、この画面と同じ操作ができます。</p></div>
      <div><h2 style="margin-top:0">スマホで参加</h2><div class="qr">${qrSVG(joinURL)}</div><p class="sub" style="margin-top:14px">部屋コード</p><p class="roomcode num">${code}</p><p class="sub" style="word-break:break-all">${esc(joinURL)}</p>${modeNote()}</div></div>`;
    }else if(ph==='ranking'){
      h=`<div class="split"><div>${mk(0,'はじめる前に')}<h1>大事な順に、7枚を並べています</h1><p class="sub">この順位は誰にも見せず、診断にだけ使います。</p></div><div><h2 style="margin-top:0">並べ終えた人</h2>${status(p=>p.rankDone?['済み',1]:['考え中',0])}</div></div>`;

      <div><h2 style="margin-top:0">選び終えた人</h2>${status(p=>p.submitted?['済み',1]:['考え中',0])}${evNote()}</div></div>`;
    }else if(ph==='reveal'){
      h=`<div class="split"><div>${mk(V.round,kan[V.round]+'巡目')}<h1>手放された札</h1>${pubBoard(V,`1枚手放されるごとに+${C.inc}、誰も手放さなければ−${C.dec}`)}</div>

      ${ph==='final-choose'?`<p class="timer num" data-live>${V.left}</p><p class="sub" style="text-align:center">時間切れなら、どちらかが自動で残ります。</p>`:''}</div>
      <div>${ph==='final-bet'?`<h2 style="margin-top:0">どちらを残すかに${C.bet}点を賭けています</h2><p class="sub">賭けた札は、選び終わるまで伏せます。</p>${status((p,i)=>i===V.j?['選ぶ人',0]:V.betDone.includes(i)?['済み',1]:['考え中',0])}<button class="go" data-act="closebets">賭けを締め切る</button>`:`<h2 style="margin-top:0">相場は止まっています</h2><p class="sub">全員が選び終えたら、最終相場を出します。</p>`}</div></div>`;
    }else if(ph==='final-reveal'){
      const ch=PL[V.j];
      h=`<div class="split"><div>${mk(6,`最後の二択 ${V.j+1}/${PL.length}人目`)}<h1>${esc(ch.name)}さんは「${CARDS[V.keep].n}」を残した</h1><div class="hand big"><div>${card(V.keep)}</div></div><p class="sub" style="text-align:center;margin-top:12px">手放したのは「${CARDS[V.drop].n}」</p></div>

    }else if(ph==='results'){

      <table class="list"><tr><th>名前</th><th class="r">予想</th><th class="r">最後の一枚</th><th class="r">賭け</th><th class="r">合計</th></tr>${R.rows.map(x=>`<tr><td>${esc(PL[x.i].name)}</td><td class="r num">${x.a}</td><td class="r num">${x.b}</td><td class="r num">${sgn(x.bet)}</td><td class="r num"><b>${x.t}</b></td></tr>`).join('')}</table>

    }

  }

      }else if(ph==='final-bet'){
        const ch=V.players[V.j];
        if(me===V.j)h=wait('次はあなたの二択','全員が賭け終えたら、10秒で1枚を選びます。')+ctl('closebets','賭けを締め切る');
        else if(V.betDone.includes(me)||sel.sent!==null)h=wait('賭けました',`${esc(ch.name)}さんの選択を待っています。`)+ctl('closebets','賭けを締め切る');
        else h=`${mk(6,'最後の二択')}<h1>${esc(ch.name)}さんが残すのは</h1><p class="sub">当たれば+${C.bet}点、外れれば−${C.bet}点。賭けた札は、選び終わるまで伏せます。</p>
          <div class="hand big">${ch.hand.map(c=>pickBtn(c,`data-act="bet" data-c="${c}"`,false,'',V.frozen[c])).join('')}</div><button class="plain" data-act="nobet" style="display:block;margin:24px auto 0">賭けない</button>`;
      }else if(ph==='final-choose'){
        const ch=V.players[V.j];
        if(me===V.j&&sel.sent===null)h=`${mk(6,'最後の二択')}<h1>残す1枚を選ぶ</h1><p class="timer num" data-live>${V.left}</p><div class="hand big">${M.hand.map(c=>pickBtn(c,`data-act="keep" data-c="${c}"`,false,'',V.frozen[c])).join('')}</div>`;
        else h=wait(me===V.j?'選びました':`${esc(ch.name)}さんが選んでいます`,`残り<span data-live>${V.left}</span>秒`);
      }else if(ph==='final-reveal'){
        const ch=V.players[V.j],b=V.lastBets.find(x=>x.i===me);
        h=`${mk(6,'最後の二択')}<h1>${esc(ch.name)}さんは「${CARDS[V.keep].n}」を残した</h1><div class="hand big"><div>${card(V.keep)}</div></div>
          <p style="text-align:center;margin-top:16px">${me===V.j?`手放したのは「${CARDS[V.drop].n}」。`:b?(b.w?`<span class="up">賭けに勝ち、+${C.bet}点</span>`:`賭けに負け、−${C.bet}点`):'賭けていません。'}</p>${ctl('next',V.j<V.players.length-1?'次の人へ':'最終相場を出す')}${nextNote}`;
      }else if(ph==='results'){
        const R=V.results,pos=R.rows.findIndex(x=>x.i===me)+1,row=R.rows[pos-1];
        h=`${mk(7,'終局')}<h1>${pos}位、<span class="num">${row.t}</span>点</h1><p class="sub">予想 ${row.a}点、最後の一枚 ${row.b}点、賭け ${sgn(row.bet)}点</p>${certHTML(R.certs[me],M.name)}${TEST?`<h2>ほかの人の証券</h2>${R.certs.map((d,i)=>i===me?'':certHTML(d,V.players[i].name)).join('')}`:'<p class="sub">ほかの人の証券は、テレビに出ています。</p>'}${ctl('again','同じ顔ぶれでもう一度')}`;
      }
    }
    paint(h,V?V.phase+'|'+V.round+'|'+(V.j??''):'join');
  }
  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,c=b.dataset.c===undefined?null:+b.dataset.c;
    if(a==='ctl'){send({type:'ctl',op:b.dataset.op});window.scrollTo(0,0);return}
    if(a==='join'){const n=document.getElementById('nm').value.trim();if(!n){document.getElementById('nm').focus();return}myName=n;try{localStorage.setItem('saigo-name',n)}catch(e){}joined=true;send({type:'join',name:n});return}
    if(a==='rk'){if(!sel.rank.includes(c))sel.rank.push(c);render();return}
    if(a==='rkreset'){sel.rank=[];render();return}
    if(a==='rkok'){sel.sent=true;send({type:'rank',order:sel.rank})}
    if(a==='pd'){sel.d=c;render();return}
    if(a==='pg'){sel.g=c;render();return}
    if(a==='pok'){sel.sent={pick:sel.d,guess:sel.g};send({type:'turn',pick:sel.d,guess:sel.g})}
    if(a==='bet'){sel.sent=c;send({type:'bet',card:c})}
    if(a==='nobet'){sel.sent=-1;send({type:'bet',card:null})}
    if(a==='keep'){sel.sent=c;send({type:'keep',card:c})}
    render();window.scrollTo(0,0)});
  render();
  connect(code,opt.mem).then(n=>{net=n;n.onState(s=>{V=s;window.__pV=V;if(joined||V.players.some(p=>p.id===pid))joined=true;render()})}).catch(()=>{app.insertAdjacentHTML('afterbegin','<p class="mode">通信の準備に失敗しました。通信環境を確認して、ページを読み込み直してください。</p>')});
}

/* ================= 入口 ================= */
function landing(){
  const go=u=>{location.href=u};
  app.innerHTML=`<div class="screen"><div class="fan" aria-hidden="true">${CARDS.map((c,i)=>card(i)).join('')}</div><h1>最後の一枚</h1><p class="sub">7枚の価値観を1枚ずつ手放し、最後に残った1枚で本性を診断します。3〜7人で遊べます。</p>
  <button class="go" data-act="host">テレビで部屋を作る</button>
  <h2>スマホで参加</h2><label for="cd">部屋コード(4文字)</label><input id="cd" class="field code" maxlength="4" autocomplete="off" autocapitalize="characters"><button class="plain" data-act="join" style="margin-top:12px">参加する</button>
  <h2>ひとりで試す</h2><p class="sub">CPUを相手に、テレビも通信も使わずに遊べます。</p><button class="plain" data-act="test">CPUと遊ぶ</button>${modeNote()}</div>`;
  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const u=new URL(location.href);u.search='';
    if(b.dataset.act==='host'){u.searchParams.set('host','new');go(u)}
    else if(b.dataset.act==='test'){u.searchParams.set('test','1');go(u)}
    else{const v=document.getElementById('cd').value.trim().toUpperCase();if(v.length!==4){document.getElementById('cd').focus();return}u.searchParams.set('room',v);go(u)}});
}
const fanFix=()=>document.querySelectorAll('.fan .cd').forEach((el,i)=>{el.style.transform=`rotate(${(i-3)*11}deg)`});
new MutationObserver(fanFix).observe(app,{childList:true,subtree:true});
if(params.get('test')){const mem=memTransport();hostMain({mem});playerMain('TEST',{mem})}
else if(params.get('host'))hostMain();else if(params.get('room'))playerMain(params.get('room').toUpperCase().slice(0,4));else landing();
}
</script>
