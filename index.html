<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最後の一枚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
/* VOICE 気心の知れた宴席。騒がしくせず、札をめくるときの静かな緊張を出す
   IDEA 取引所の相場板と、銘柄としての価値観札。最後に残した札が「本性証券」として発行される
   PICTURE テレビ:大きな相場板と進行状況。スマホ:手札と自分の証券
   COLOUR 紙の白と墨。札ごとに伝統色を1色ずつ割り当て、色は銘柄の識別にだけ使う
   TYPE 札名・見出しは Zen Old Mincho、本文と数字は Zen Kaku Gothic New
   LAYOUT テレビは相場板と状況の2列。スマホは1列。決定ボタンは墨の1か所だけ */
:root{color-scheme:light dark;--bg:light-dark(#f7f6f2,#121315);--card:light-dark(#ffffff,#1c1d20);--ink:light-dark(#1f1d1a,#ebe8e1);--sub:light-dark(#6b6760,#9f9b93);--line:light-dark(#d9d5cc,#36373b);--up:light-dark(#b23a22,#f08a6e);--down:light-dark(#2e5b86,#87b3df)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{position:relative}
body{font:16px/1.85 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.04em;overflow-x:clip;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:18px 20px 72px}
h1.wb{word-break:keep-all;overflow-wrap:anywhere}
h1{font:600 30px/1.35 "Zen Old Mincho",serif;letter-spacing:.08em;margin:0 0 8px;text-wrap:balance}
h2{font:600 18px/1.5 "Zen Old Mincho",serif;letter-spacing:.1em;margin:36px 0 14px}
p{margin:0 0 12px}
.sub{color:var(--sub);font-size:14px;line-height:1.75}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mark{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--sub);margin:0 0 12px}
.prog{display:flex;gap:4px}.prog i{display:block;width:16px;height:4px;border-radius:2px;background:var(--line)}.prog i.done{background:var(--sub)}.prog i.now{background:var(--ink)}
.fan{position:relative;height:230px;margin:8px 0 28px}
.fan .cd{position:absolute;left:50%;bottom:0;width:92px;margin-left:-46px;transform-origin:50% 140%}
.cd{display:flex;flex-direction:column;align-items:center;aspect-ratio:5/7;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 4px 9px;position:relative;color:var(--ink);text-align:center;overflow:hidden}
.cd .in{position:absolute;inset:6px;border:1px solid var(--c);border-radius:4px;opacity:.55}
.cd .kj{position:absolute;top:9px;left:10px;font:900 13px/1 "Zen Old Mincho",serif;color:var(--c)}
.cd svg{display:block;width:70%;margin:20% auto auto;flex:none}
.cd .nm{font:600 13px/1.3 "Zen Old Mincho",serif;letter-spacing:.06em;white-space:nowrap}
.cd .pz{font-size:11px;line-height:1.3;color:var(--sub);margin-top:2px}
.pick{appearance:none;font:inherit;padding:0;border:0;background:none;cursor:pointer;border-radius:8px;transition:transform .15s}
.pick[aria-pressed=true]{transform:translateY(-8px)}
.pick[aria-pressed=true] .cd{border:2px solid var(--ink);padding:6px 3px 8px}
.cd .rk{position:absolute;top:8px;right:8px;font-size:11px;line-height:1;color:var(--sub)}
.cd .rk.hon{color:var(--bg);background:var(--ink);font-weight:700;padding:2px 4px;border-radius:3px;top:6px;right:6px}
.hint{font-size:14px;line-height:1.75;margin:14px 0 0;padding:10px 12px;border-left:2px solid var(--ink);background:var(--card)}
.hint.off{border-left-color:var(--line);color:var(--sub)}
.stand tr.me td{font-weight:700}
.mine{font-size:14px;color:var(--sub);margin:0 0 14px}.mine b{font-size:18px;color:var(--ink);margin:0 2px}
.dist{list-style:none;padding:0;margin:8px 0 0}
.dist li{display:grid;grid-template-columns:34px 6.4em minmax(0,1fr) 2.5em;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dist li svg{width:30px;height:30px;display:block}.dist .dn{font:600 16px/1.3 "Zen Old Mincho",serif}.dist .who2{font-size:14px;color:var(--sub)}.dist .ct{text-align:right;font-weight:700}
.dist li.ans{border-bottom:2px solid var(--ink)}.dist li.ans .who2{color:var(--ink)}.dist li.zero{opacity:.45}
.spotline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rules{list-style:none;padding:0;margin:0;font-size:15px}.rules li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.rules b{font-weight:700}
.pick .ord{position:absolute;top:6px;right:8px;font:700 15px/1 "Zen Kaku Gothic New",sans-serif;z-index:1}
.hand{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px 8px;padding-top:10px;max-width:480px}
.hand.big{grid-template-columns:repeat(2,minmax(0,150px));justify-content:center;gap:20px;max-width:none}
.hand.big .cd{padding-bottom:14px}.hand.big .cd .nm{font-size:19px}.hand.big .cd .pz{font-size:13px}.hand.big .cd .kj{font-size:16px;top:12px;left:13px}
.board{width:100%;border-collapse:collapse;margin-top:4px}
.board caption{text-align:left;color:var(--sub);font-size:13px;padding-bottom:4px}
.board td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.board .ic{width:32px}.board .ic svg{width:28px;height:28px;display:block}
.board .bn{font:600 16px/1.3 "Zen Old Mincho",serif;letter-spacing:.06em}
.board .sp{width:72px}.board .sp svg{display:block;width:72px;height:24px}
.board .pr{width:3.4em;text-align:right;font-size:19px;font-weight:700}
.board .df{width:4.2em;text-align:right;font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
.notice{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 2px;margin:22px 0;font-size:15px}
.notice b{font-family:"Zen Old Mincho",serif;font-weight:600}
button,input,select{font:inherit;letter-spacing:.04em}
.go{display:block;width:100%;margin-top:28px;min-height:54px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;letter-spacing:.12em;cursor:pointer}
.go:disabled{background:var(--line);color:var(--sub);cursor:default}
.plain{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.plain:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.field{width:100%;min-height:50px;font-size:18px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.field.code{text-transform:uppercase;letter-spacing:.4em;font-weight:700}
label{display:block;font-size:14px;color:var(--sub);margin:18px 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.list{width:100%;border-collapse:collapse;font-size:15px}
.list th,.list td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:400;vertical-align:top}
.list th{color:var(--sub);font-size:13px}
.list .r{text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.seg button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.wait{text-align:center;padding-top:8vh}
.back{width:130px;margin:0 auto 24px;aspect-ratio:5/7;border-radius:9px;background:var(--card);border:1px solid var(--line);padding:8px}
.back svg{width:100%;height:100%;display:block}
.who{font:600 28px/1.4 "Zen Old Mincho",serif;letter-spacing:.08em;margin:0 0 6px}
.timer{font:600 64px/1.2 "Zen Old Mincho",serif;text-align:center;margin:8px 0 4px}
.people{list-style:none;padding:0;margin:0}
.people li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.people .st{color:var(--sub);font-size:14px;white-space:nowrap}
.people .ok{color:var(--ink)}
.cert{background:var(--card);border:1px solid var(--ink);padding:6px;margin:0 0 24px}
.cert .fr{border:1px solid var(--line);padding:22px 20px 18px;position:relative;height:100%}
.cert .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.cert .tt{font:900 20px/1 "Zen Old Mincho",serif;letter-spacing:.4em}
.cert .no{font-size:13px;color:var(--sub)}
.cert .body{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:end}
.cert .chara{border-radius:10px}
.cert .hd{border-bottom:2px solid var(--g,var(--line))}
.chara{display:block;width:100%;height:auto}
.cert .grp{display:flex;align-items:center;gap:6px;font-size:13px;margin:2px 0 2px}.cert .grp i,.gnav a i,.gsec h2 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g)}
.cert .love{display:flex;align-items:center;gap:6px;font-size:14px;margin:4px 0 0}.cert .love .mini{display:block;width:24px;height:24px}.cert .love .mini svg{width:100%;height:100%;display:block}
.cert .holder{font-size:14px;color:var(--sub);margin:0}
.cert .mod{font:600 15px/1.4 "Zen Old Mincho",serif;letter-spacing:.06em;margin:6px 0 0}
.cert .type{font:600 25px/1.35 "Zen Old Mincho",serif;letter-spacing:.06em;margin:0 0 6px;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.cert .story{font:600 16px/1.8 "Zen Old Mincho",serif;letter-spacing:.04em;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.cert .path{display:flex;align-items:center;gap:4px;margin:14px 0 2px}
.cert .path span{display:block;width:30px;height:30px;opacity:.5}.cert .path svg{width:100%;height:100%;display:block}
.cert .path .last{opacity:1;width:38px;height:38px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);box-sizing:content-box}
.cert .pcap{font-size:12px;color:var(--sub);margin:0}
.cert .lead{font-size:15px;line-height:1.9;margin:16px 0 0}
.cert .txt{font-size:15px;line-height:1.85;margin:0}
.axes{display:grid;gap:12px;margin:2px 0 0}
.axr{display:grid;grid-template-columns:7.8em minmax(40px,1fr) 7.8em;white-space:nowrap;gap:10px;align-items:center;font-size:13px;color:var(--sub)}
.axr .r{text-align:right}.axr .on{color:var(--ink);font-weight:700}.axr b{font-weight:700}
.bar{position:relative;display:block;height:8px;border-radius:4px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--g,var(--ink))}
.sw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.sw ul{margin:0;padding-left:1.1em;font-size:14px;line-height:1.75}.sw li{margin-bottom:4px}
.cert .word{font:600 17px/1.7 "Zen Old Mincho",serif;margin:0;text-wrap:balance}
.cert .lead,.cert .txt,.cert .story{text-wrap:pretty}
.cert .pair{grid-template-columns:repeat(auto-fit,minmax(9em,1fr))}
@media(max-width:420px){.sw{grid-template-columns:minmax(0,1fr)}.axr{grid-template-columns:7.4em minmax(32px,1fr) 7.4em;font-size:12px}.cert .body{grid-template-columns:minmax(0,1fr)!important;justify-items:center;text-align:center}.cert .body .chara{width:150px}.cert .grp,.cert .love{justify-content:center}}
.cert .sec{font-size:12px;color:var(--sub);letter-spacing:.06em;margin:18px 0 6px}
.cert .pro{font-size:15px;line-height:1.8;margin:14px 0 0}
.cert .story{font:600 16px/1.8 "Zen Old Mincho",serif;margin:0;padding:0;border:0}
.cert .story+.story{margin-top:4px}
.chart{display:grid;grid-template-columns:5.2em auto minmax(0,1fr);gap:4px 12px;align-items:center;margin:0;font-size:14px}
.chart dt{color:var(--sub)}.chart dd{margin:0}
.dots{display:flex;gap:4px}.dots i{display:block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink)}.dots i.f{background:var(--ink)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;font-size:14px}
.pair div{border-top:1px solid var(--line);padding-top:6px}.pair b{display:block;font:600 16px/1.4 "Zen Old Mincho",serif}
.care{font-size:14px;margin:0;padding:8px 10px;border:1px dashed var(--line)}
.hero{max-width:640px;margin:0 auto}
.hero .cert .body{grid-template-columns:140px minmax(0,1fr)}
.hero .cert{animation:issue .5s ease-out both}
.hero .seal{animation:stampIn .32s cubic-bezier(.2,1.7,.4,1) .7s both}
@keyframes issue{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes stampIn{from{opacity:0;transform:scale(2.4) rotate(-12deg)}to{opacity:.85;transform:scale(1) rotate(-12deg)}}
@media(prefers-reduced-motion:reduce){.hero .cert,.hero .seal{animation:none}}
.cert .face{font-size:14px;margin:0}
.cert .face b{font:600 22px/1 "Zen Old Mincho",serif;margin-left:6px}
.cert .seal{position:absolute;right:16px;bottom:14px;width:46px;height:46px;border:1.5px solid var(--up);border-radius:50%;color:var(--up);font:900 12px/1.15 "Zen Old Mincho",serif;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);opacity:.85}
.cert .ft{margin-top:16px;font-size:12px;color:var(--sub);padding-right:64px;min-height:40px;display:flex;align-items:flex-end}
.qr{background:#fff;padding:14px;border-radius:8px;width:max-content;max-width:100%;border:1px solid var(--line)}
.qr svg{display:block;width:220px;height:220px}
.roomcode{font:900 44px/1.1 "Zen Old Mincho",serif;letter-spacing:.3em;margin:6px 0}
.mode{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:20px}
.topbar{display:flex;justify-content:space-between;gap:12px;max-width:600px;margin:0 auto;padding:12px 16px 0}
.tb,.snd{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
.tb[hidden]{display:none}.topbar .tl{display:flex;gap:8px}
a.tb{display:inline-flex;align-items:center;text-decoration:none}
.snd.need{color:var(--ink);border-color:var(--ink)}
.guide{counter-reset:g;list-style:none;padding:0;margin:0 0 18px;border:1px solid var(--line);background:var(--card);border-radius:6px}
.guide li{counter-increment:g;position:relative;padding:10px 12px 10px 2.6em;border-bottom:1px solid var(--line);font-size:15px;line-height:1.7}.guide li:last-child{border-bottom:0}
.guide li::before{content:counter(g);position:absolute;left:12px;top:10px;font:600 16px/1.7 "Zen Old Mincho",serif}
.timeleft{font-size:15px;color:var(--sub);margin:0 0 10px}.timeleft .cdv{font-size:20px;font-weight:700;color:var(--ink);margin-left:4px}
.cdv{font-variant-numeric:tabular-nums}.cdv.low{color:var(--up)}
.mine .mcd{margin-left:14px}.mine .mcd .cdv{font-weight:700;color:var(--ink)}.mine .mcd .cdv.low{color:var(--up)}
.dlg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;padding:20px;z-index:20}
.dlg .box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px 20px 18px;max-width:420px;width:100%}
.dlg .box p{margin:0 0 6px}.dlg .row{flex-direction:column-reverse;align-items:stretch;margin-top:18px}.dlg .go,.dlg .plain{width:100%;margin:0;min-height:48px}
/* 解説ページ */
.gnav{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0 0;padding:0;list-style:none}
.gnav a{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;font-size:14px}
.axtab td:first-child{white-space:nowrap;font-weight:600;padding-right:14px}
.ty .sec{font-size:12px;color:var(--sub);letter-spacing:.06em;margin:16px 0 6px}
.axtab{width:100%;border-collapse:collapse;font-size:15px}.axtab th,.axtab td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.axtab th{font-size:13px;color:var(--sub);font-weight:400}
.gnav a{display:inline-flex;align-items:center;gap:6px}
.gsec{border-top:4px solid var(--g);margin-top:40px;padding-top:6px}.gsec h2{display:flex;align-items:center;gap:8px;margin:14px 0 2px}.gsec h2 i{width:12px;height:12px}
.gpoles{font-size:13px;color:var(--sub);margin:0 0 8px}
.ty{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;border-top:1px solid var(--line);padding:22px 0 26px;scroll-margin-top:16px}
.ty .bar i{background:var(--g)}
.ty:target{background:var(--card);box-shadow:0 0 0 12px var(--card)}
.ty h3{font:600 24px/1.4 "Zen Old Mincho",serif;letter-spacing:.06em;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}.chips li{font-size:13px;padding:2px 10px;border:1px solid var(--line);border-radius:12px}
.ty .txt{font-size:15px;line-height:1.85;margin:0 0 10px}.ty .word{font:600 16px/1.7 "Zen Old Mincho",serif;margin:12px 0 0}
.ty .match{font-size:14px;margin:10px 0 0}.ty .match a{color:var(--ink)}
.cardlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 20px;margin:12px 0 0}
.cl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}.cl h4{font:600 17px/1.4 "Zen Old Mincho",serif;margin:0 0 4px}.cl p{font-size:14px;line-height:1.75;margin:0}.cl .care2{color:var(--sub);margin-top:4px}
.more{display:inline-block;margin-top:14px;font-size:14px;color:var(--ink)}
.foot{margin-top:40px;font-size:13px;color:var(--sub)}
/* テレビ */
/* 遊び方の説明(1回目だけ) */
.lead2{font-size:16px;color:var(--sub);margin:0 0 14px}
.howl{counter-reset:h;list-style:none;padding:0;margin:0}
.howl li{counter-increment:h;position:relative;padding:12px 0 12px 2.2em;border-top:1px solid var(--line);font-size:16px;line-height:1.85}
.howl li:last-child{border-bottom:1px solid var(--line)}
.howl li::before{content:counter(h);position:absolute;left:2px;top:12px;font:600 18px/1.7 "Zen Old Mincho",serif}
.hf{margin:22px 0 4px}
.hf0{display:flex;align-items:center;justify-content:center;gap:18px}.hf0 .fan.sm{height:150px;width:190px;margin:0}.hf0 .fan.sm .cd{width:64px;margin-left:-32px}
.hf0 .arw{font-size:28px;color:var(--sub)}.hf0 .one .cd{width:88px}
.hf1{list-style:none;padding:0;max-width:300px;margin-left:auto;margin-right:auto}.hf1 li{display:grid;grid-template-columns:1.6em 30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.hf1 .ic svg{width:26px;height:26px;display:block}.hf1 .bn{font:600 15px/1.3 "Zen Old Mincho",serif}.hf1 .no{color:var(--sub);text-align:right}
.hf1 .tag{font-size:12px;font-weight:700;border:1px solid var(--ink);border-radius:4px;padding:0 6px}
.hf2{display:grid;grid-template-columns:repeat(2,minmax(0,120px));justify-content:center;gap:28px}.hf2 .st2{font-size:14px;font-weight:700;margin:0 0 8px;text-align:center}
.hf2 .q,.hf3 .q{font-size:13px;color:var(--sub);text-align:center;margin:8px 0 0;line-height:1.6}
.hf3{display:grid;gap:8px;max-width:320px;margin-left:auto;margin-right:auto}
.mk2{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.mk2 .ic svg{width:26px;height:26px;display:block}.mk2 .bn{font:600 15px/1.3 "Zen Old Mincho",serif}.mk2 .pr{font-weight:700}.mk2 .s{grid-column:2/-1;font-size:12px;color:var(--sub)}
.hf3 .two{display:grid;grid-template-columns:repeat(2,90px);justify-content:center;gap:16px;margin-top:10px}
.howrow{justify-content:center;margin-top:14px}

	getBestMaskPattern : function() {

		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);

		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);

		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);

	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);

		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}

		}

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;

		var bits = QRUtil.getBCHTypeInfo(data);

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

const rnd=()=>Math.random();

        `<h2>最終相場</h2>${board(V.prices,V.frozen,V.hist,'')}${go('nextcert','本性証券を発行する')}`);
      else if(V.cer<n){const i=R.order[V.cer];h=`${mk(7,`本性証券の発行 ${V.cer+1}/${n}`)}${certTV(R.certs[i],PL[i].name,PL)}<div class="cfoot"><p class="sub">飲み会でのあなた・取扱注意などの続きは、各自のスマホの証券で読めます。</p>${go('nextcert',V.cer<n-1?'次の証券を発行':'全員の証券を並べる')}</div>`}
      else h=stg(`${mk(7,'終局')}${winH}${table}`,`<h2>本性証券</h2><div class="minis">${R.certs.map((d,i)=>`<div class="mini2" style="--g:${grpOf(d.ty).c}">${charaSVG(d.ty)}<p class="mn">${esc(PL[i].name)}</p><p class="mt">${TYPES[d.ty].n}</p></div>`).join('')}</div>${go('again','同じ顔ぶれでもう一度')}`);
    }
    document.documentElement.dataset.scene=ph==='reveal'&&V.revStep===0?'dark':'';
    paint(h,ph+'|'+V.round+'|'+(V.j??'')+'|'+(V.cer??'')+'|'+(V.revStep??''));
  }
  if(!EMB){app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.dataset.act==='skip'&&!b.dataset.arm){b.dataset.arm='1';b.textContent='もう一度押すと進めます';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='待たずに進める'}},5000);return}if(acts[b.dataset.act]){SFX.play('decide');acts[b.dataset.act]()}});render(view())}
  connect(code,opt.mem).then(n=>{net=n;n.onAction(onAction);pub()}).catch(()=>{app.insertAdjacentHTML('afterbegin','<p class="mode">通信の準備に失敗しました。設定と通信環境を確認して、ページを読み込み直してください。</p>')});
  if(restored&&S.phase!=='lobby')setTimeout(()=>app.insertAdjacentHTML('afterbegin','<p class="mode">保存していた状態から再開しました。</p>'),50);
}

/* ================= スマホ(参加者) ================= */
function playerMain(code,opt={}){
  const TEST=!!opt.mem;
  let pid=null;try{pid=TEST?null:sessionStorage.getItem('saigo-pid')}catch(e){}
  if(!pid){pid='p'+Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36);try{if(!TEST)sessionStorage.setItem('saigo-pid',pid)}catch(e){}}
  let myName='';try{myName=localStorage.getItem('saigo-name')||''}catch(e){}
  let net=null,V=null,joined=false,sel={k:'',d:null,g:null,rank:[],sent:null};
  let myRank=null;try{if(!TEST)myRank=JSON.parse(sessionStorage.getItem('saigo-rank')||'null')}catch(e){}
  /* 残りの手札のうち、自分の順位でいちばん下の札(これを手放すと本音点) */
  /* 相場のおすすめ。見込み=いまの相場+次の出来事の値動き+(人気の低い札ほど、ほかの人に手放されて上がりやすい分) */
  const evDelta=(ev,pr)=>{const d=Array(7).fill(0);if(!ev)return d;if(ev.e==='crash'){let k=0;pr.forEach((x,i)=>{if(x>pr[k])k=i});d[k]=-50}else if(ev.e==='cheap'){let k=0;pr.forEach((x,i)=>{if(x<pr[k])k=i});d[k]=40}else Object.entries(ev.e).forEach(([c,x])=>d[c]=x);return d};
  const recOf=(hand,pr,ev,n)=>{const d=evDelta(ev,pr),ex=c=>Math.max(C.floor,pr[c]+d[c])+Math.round((.55-CARDS[c].pop)*20*(n-1)),s=[...hand].sort((a,b)=>ex(a)-ex(b)||a-b);return{drop:s[0],keep:s[s.length-1],ex}};
  const honestOf=hand=>myRank&&hand.length?[...hand].sort((a,b)=>myRank.indexOf(b)-myRank.indexOf(a))[0]:null;
  const rkBadge=(c,hon)=>myRank?`<span class="rk${hon?' hon':''}">${hon?'本音':myRank.indexOf(c)+1+'位'}</span>`:'';
  const myCard=(c,attr,pressed,price,hon)=>pickBtn(c,attr,pressed,'',price).replace('<span class="in"></span>','<span class="in"></span>'+rkBadge(c,hon));
  const send=a=>{if(net)net.send(Object.assign({pid},a))};
  homeMsg=()=>!V||['lobby','results'].includes(V.phase)||!V.players.some(p=>p.id===pid)?null:TEST?'ひとりで試している途中です。ホームに戻ると、このゲームは終わります。':'途中で抜けると、その間の手番は時間切れになり、減点されます。同じURLで開き直せば戻れます。';
  function render(){
    let h='';const me=V?V.players.findIndex(p=>p.id===pid):-1,M=me>=0?V.players[me]:null,LEAD=!!V&&V.leader===pid;
    const ctl=(op,label)=>LEAD?`<button class="go" data-act="ctl" data-op="${op}">${label}</button>`:'';
    const people=()=>`<ul class="people">${V.players.map(p=>`<li><span>${esc(p.name)}${p.id===pid?' <span class="sub">あなた</span>':''}</span><span class="st">${p.id===V.leader?'進行役':p.cpu?'CPU':''}</span></li>`).join('')}</ul>`;
    const nextNote=LEAD?'':`<p class="sub" style="margin-top:16px">進行役が次へ進めます。</p>`;
    const head=TEST?'ひとりで試す':'部屋 '+esc(code);
    const wait=(t,s='')=>`<div class="wait"><div class="back">${backArt}</div><p class="who">${t}</p>${s?`<p class="sub">${s}</p>`:''}</div>`;
    const first=V&&V.first;
    if(!V||me<0){
      h=`${mk(null,head)}<h1>${TEST?'CPUと遊ぶ':'参加する'}</h1>${TEST?'<p class="sub">テレビも通信も使わずに、最後まで遊べます。</p>':''}${V&&V.phase!=='lobby'&&joined?'<p>この部屋はもう始まっています。次の回から参加してください。</p>':''}
      <label for="nm">名前(10文字まで)</label><input id="nm" class="field" maxlength="10" value="${esc(myName)}" autocomplete="nickname">
      <button class="go" data-act="join">${TEST?'始める':'参加する'}</button>${!V&&!TEST?'<p class="sub" style="margin-top:14px">テレビとつないでいます。</p>':''}${TEST?'':modeNote()}`;
    }else{
      const ph=V.phase,key=ph+'|'+V.round+'|'+(V.j??'')+'|'+(V.cer??'');if(sel.k!==key){sel={k:key,d:null,g:null,rank:[],sent:null}}
      if(ph==='lobby'){
        if(LEAD){const n=V.players.length;h=`${mk(null,head)}<h1>参加者 <span class="num">${n}/${C.max}</span>人</h1><p class="sub">あなたが進行役です。足りない人数はCPUで補えます。</p>${people()}
          <div class="row"><button class="plain" data-act="ctl" data-op="cpu"${n>=C.max?' disabled':''}>CPUを加える</button><button class="plain" data-act="ctl" data-op="uncpu"${V.players.some(p=>p.cpu)?'':' disabled'}>CPUを減らす</button></div>
          <button class="go" data-act="ctl" data-op="start"${n<C.min?' disabled':''}>${n<C.min?`あと${C.min-n}人で始められます`:'この顔ぶれで始める'}</button>`}
        else h=wait(`${esc(M.name)}さん`,'進行役が始めるのを待っています。')+people();
      }else if(ph==='howto'){const k=V.how,last=k===HOW_N-1;

        else{const hon=honestOf(M.hand);h=`${mk(V.round,kan[V.round]+'巡目')}${V.firedEv?`<div class="notice" style="margin-top:0"><b>${/^「/.test(V.firedEv.n)?esc(V.firedEv.n):`「${esc(V.firedEv.n)}」`}</b>が起きました。${esc(V.firedEv.t)}</div>`:''}${isSpot?`<div class="notice" style="margin-top:0"><b>今巡の注目は、あなたです。</b>全員があなたの手放す札を予想しています。全員を外させれば+${C.foolAll}点、半数より多く外させれば+${C.foolHalf}点。</div>`:''}
          ${first&&V.round<=2?`<h2 style="margin-top:0">いまやること</h2>${guide(isSpot?['今回はあなたが注目の人です。予想はせず、手放す札を1枚だけ選びます。',`「本音」と書いた札を手放すと+${C.hon}点。みんなの予想を外させると、さらに点がもらえます。`,'選んだら、いちばん下の「これで決める」を押します。決めるまでは何度でも選び直せます。']:[`まず、手放す札を1枚押してください。「本音」と書いた札なら+${C.hon}点です。`,`次に、${esc(tp.name)}さんが手放しそうな札を予想して押してください。当たれば+${C.a}点です。`,'2つ選んだら、いちばん下の「この2つで決める」を押します。決めるまでは何度でも選び直せます。'])}`:''}
          <h1>${isSpot?'手放す札を選ぶ':'1. 手放す札を選ぶ'}</h1><p class="sub">最後に残した1枚の相場が得点になります。札の右上はあなたの順位です。</p>
          <div class="hand" style="--n:${cols(M.hand.length)}">${M.hand.map(c=>myCard(c,`data-act="pd" data-c="${c}"`,sel.d===c,V.prices[c],c===hon)).join('')}</div>
          ${(()=>{const R=recOf(M.hand,V.prices,V.nextEv,V.players.length);const nm=c=>`<span class="ric">${art(c)}</span>${CARDS[c].n}`;
            return`<div class="rec"><p class="rl">相場のおすすめ</p><p>手放すなら <button class="rbtn" data-act="pd" data-c="${R.drop}">${nm(R.drop)}</button><span class="rx">見込み ${R.ex(R.drop)}</span></p><p>最後まで残したい <b>${nm(R.keep)}</b><span class="rx">見込み ${R.ex(R.keep)}</span></p><p class="sub">見込みは、いまの相場に${V.nextEv?'次の出来事と、':''}ほかの人に手放されやすさを足した目安です。${hon!==null?(R.drop===hon?'本音の札と同じなので、本音点ももらえます。':`本音の札は「${CARDS[hon].n}」。本音を通すか、相場を取るかです。`):''}</p></div>`})()}

          <p style="text-align:center;margin-top:16px">${me===V.j?`${V.gAuto?'進行役が先に進めたため、自動で残りました。':''}手放したのは「${CARDS[V.drop].n}」。${V.gHonest?`本音どおり +${C.hon}点。`:''}`:b?(b.w?`<span class="up">賭けに勝ち、+${C.bet}点</span>`:`賭けに負け、−${C.bet}点`):'賭けていません。'}</p><h2>確定点の順位</h2>${standHTML(V.players,V.dfx,me)}${ctl('next',V.j<V.players.length-1?'次の人へ':'最終相場を出す')}${nextNote}`;
      }else if(ph==='results'){
        const R=V.results,pos=R.rows.findIndex(x=>x.i===me)+1,row=R.rows[pos-1],n=V.players.length,myTurn=R.order.indexOf(me),issued=V.cer>=myTurn;
        const scoreLine=`<p class="sub">予想 ${row.a}点、本音 ${row.h}点、注目 ${row.f}点、ダウト ${row.d}点、${row.m?`時間切れ ${sgn(row.m)}点、`:''}最後の一枚 ${row.b}点、賭け ${sgn(row.bet)}点</p>`;
        if(TEST){
          if(V.cer<0)h=`${mk(7,'終局')}<h1>${pos}位、<span class="num">${row.t}</span>点</h1>${scoreLine}<table class="list" style="margin-top:12px"><tr><th>名前</th><th class="r">合計</th></tr>${R.rows.map(x=>`<tr><td>${esc(V.players[x.i].name)}</td><td class="r num">${x.t}</td></tr>`).join('')}</table>${ctl('nextcert','本性証券を発行する')}`;
          else if(V.cer<n){const i=R.order[V.cer];h=`${mk(7,`本性証券の発行 ${V.cer+1}/${n}`)}<div class="hero">${certHTML(R.certs[i],V.players[i].name,V.players)}</div>${ctl('nextcert',V.cer<n-1?'次の証券を発行':'終わる')}`}
          else h=`${mk(7,'終局')}<h1>${pos}位、<span class="num">${row.t}</span>点</h1>${scoreLine}${certHTML(R.certs[me],M.name,V.players)}${ctl('again','同じ顔ぶれでもう一度')}`;
        }else{
          h=`${mk(7,'終局')}<h1>${pos}位、<span class="num">${row.t}</span>点</h1>${scoreLine}
          ${issued?`<div class="hero">${certHTML(R.certs[me],M.name,V.players)}</div>`:`<div class="wait" style="padding-top:24px"><div class="back">${backArt}</div><p class="who">証券の発行待ち</p><p class="sub">${myTurn-V.cer<=1?'次に、テレビで発行されます。':`テレビで発行されるまで、あと${myTurn-V.cer}枚です。`}</p></div>`}
          ${V.cer<n?ctl('nextcert',V.cer<0?'本性証券を発行する':V.cer<n-1?'次の証券を発行':'全員の証券を並べる'):ctl('again','同じ顔ぶれでもう一度')}`;
        }
      }
    }
    /* 遊んでいる間は、画面の上に自分の確定点と順位を出す */
    if(M&&['turn','reveal','final','final-reveal'].includes(V.phase))h=`<p class="mine">確定<b class="num">${M.fx}</b>点・${rankOf(V.players,me)}位/${V.players.length}人</p>`+h;
    document.documentElement.dataset.scene=V&&V.phase==='reveal'&&V.revStep===0?'dark':'';
    paint(h,V?V.phase+'|'+V.round+'|'+(V.j??'')+'|'+(V.cer??'')+'|'+(V.revStep??''):'join');
  }
  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,c=b.dataset.c===undefined?null:+b.dataset.c;
    SFX.play(['rk','pd','pg'].includes(a)?'tap':'decide');
    if(a==='ctl'){send({type:'ctl',op:b.dataset.op});window.scrollTo(0,0);return}
    if(a==='join'){const n=document.getElementById('nm').value.trim();if(!n){document.getElementById('nm').focus();return}myName=n;try{localStorage.setItem('saigo-name',n)}catch(e){}joined=true;send({type:'join',name:n});return}
    if(a==='rk'){if(!sel.rank.includes(c))sel.rank.push(c);render();return}
    if(a==='rkreset'){sel.rank=[];render();return}
    if(a==='rkok'){sel.sent=true;myRank=sel.rank.slice();try{if(!TEST)sessionStorage.setItem('saigo-rank',JSON.stringify(myRank))}catch(e){}send({type:'rank',order:sel.rank})}
    if(a==='pd'){sel.d=c;render();return}
    if(a==='pg'){sel.g=c;render();return}
    if(a==='pok'){sel.sent={pick:sel.d,guess:sel.g};send({type:'turn',pick:sel.d,guess:sel.g})}
    if(a==='bet'){sel.sent=c;send({type:'bet',card:c})}
    if(a==='nobet'){sel.sent=-1;send({type:'bet',card:null})}
    if(a==='keep'){sel.sent=c;send({type:'keep',card:c})}
    if(a==='dv'){const v=b.dataset.v;sel.sent=v;send({type:'doubt',v})}
    render();window.scrollTo(0,0)});
  render();
  let pc=null;
  function playerCues(V){const me=V.players.findIndex(p=>p.id===pid),p=pc;pc={ph:V.phase,r:V.round,j:V.j,cer:V.cer,rs:V.revStep,n:V.players.length};if(!p||me<0)return;
    const changed=V.phase!==p.ph||V.round!==p.r||V.j!==p.j;
    if(changed){
      if(TEST){if(V.phase==='ranking'||V.phase==='turn'||V.phase==='final')SFX.play('hyoshigi');if(V.phase==='reveal')SFX.play('roll',C.rollAt);if(V.phase==='turn'&&V.firedEv)SFX.play('bell',.45)}
      if(V.phase==='final-reveal'){const b=(V.lastBets||[]).find(y=>y.i===me);SFX.play('stamp');if(b)SFX.play(b.w?'coin':'miss',.3);else if(me===V.j&&V.gHonest)SFX.play('rin',.3)}
      if(V.phase==='results')SFX.play(TEST?'fanfare':'reveal');
      return}
    if(V.phase==='reveal'&&V.revStep>=1&&p.rs===0){const X=V.reveal,g=X.guesses[me];if(TEST)SFX.play('ta');if(g&&g.hit||me===X.spot&&X.bonus)SFX.play('coin',.55)}
    if(V.phase==='reveal'&&V.revStep===2&&p.rs!==2){const X=V.reveal,x=X.all[me],D=V.doubt,mv=D&&D.votes[me];if(TEST&&D)SFX.play('stamp');if(x.honest)SFX.play('rin',.3);if(mv)SFX.play(mv.ok?'coin':'miss',.35);if(D&&me===X.spot&&D.gain)SFX.play('coin',.35);if(x.to)SFX.play('miss',.4)}
    if(V.phase==='results'&&V.cer!==p.cer&&V.results){const t=V.results.order.indexOf(me);if(TEST&&V.cer>=0&&V.cer<V.players.length||!TEST&&V.cer===t)SFX.play('stamp',.7)}
    if(V.phase==='lobby'&&TEST&&V.players.length>p.n)SFX.play('join');
  }
  /* 残り時間の音:自分がまだ決めていないときだけ鳴らす */
  /* 時間制限はないので、秒読みの音は鳴らさない */
  connect(code,opt.mem).then(n=>{net=n;n.onState(s=>{
    if(s.now)OFF=s.now-Date.now();
    if(s.deck)setDeck(s.deck);
    if(V&&s.phase==='ranking'&&V.phase!=='ranking'){myRank=null;try{sessionStorage.removeItem('saigo-rank')}catch(e){}}
    playerCues(s);V=s;window.__pV=V;if(joined||V.players.some(p=>p.id===pid))joined=true;render()})}).catch(()=>{app.insertAdjacentHTML('afterbegin','<p class="mode">通信の準備に失敗しました。通信環境を確認して、ページを読み込み直してください。</p>')});
}

/* ================= 診断の解説 ================= */
function guidePage(){
  CARDS=ALL;guideBtn.hidden=true;
  const poles=i=>[0,1,2,3].map(k=>POLES[k][(i>>(3-k))&1]);
  const sw=i=>[0,1,2,3].map(k=>POLE_SW[k][(i>>(3-k))&1]);
  const order=[...TYPES.keys()];
  const H=`${mk(null,'診断の解説')}<h1 class="wb">16のタイプと、<wbr>最後の一枚</h1>
  <p>本性証券のタイプは、ゲーム中の行動を4つの軸で判定し、その組み合わせで16通りに分かれます。どれも、その夜の遊び方から見えた一面です。</p>
  <h2>4つの軸</h2><table class="axtab"><tr><th>軸</th><th>判定の材料</th></tr>
  <tr><td>本音 ⇔ 損得</td><td>はじめに並べた順位どおりに手放した回数。6回のうち半分以上なら本音</td></tr>
  <tr><td>鉄仮面 ⇔ 顔に出る</td><td>注目されたときや最後の二択で、人に手の内を読まれた割合。半分以下なら鉄仮面</td></tr>
  <tr><td>我が道 ⇔ 協調</td><td>その巡でいちばん多く手放された札と、同じ札を手放した回数。5回のうち2回以下なら我が道</td></tr>
  <tr><td>観察 ⇔ 直感</td><td>注目の人が手放す札を当てた割合。4割以上なら観察</td></tr></table>
  <h2>4つの組</h2><p>16のタイプは、「本音/損得」と「鉄仮面/顔に出る」の組み合わせで、4つの組に分かれます。色は組を表しています。</p>
  <ul class="gnav">${order.map(i=>`<li><a href="#t${i}" style="--g:${grpOf(i).c}"><i></i>${TYPES[i].n}</a></li>`).join('')}</ul>
  ${GROUPS.map((G,gi)=>`<section class="gsec" style="--g:${G.c}"><h2><i></i>${G.n}</h2><p class="gpoles">${POLES[0][gi>>1]}・${POLES[1][gi&1]}</p><p>${G.d}</p>
  ${order.filter(i=>i>>2===gi).map(i=>{const T=TYPES[i],w=sw(i);return`<article class="ty" id="t${i}"><div class="tyc">${charaSVG(i)}</div><div><h3>${T.n}</h3><ul class="chips">${poles(i).map(p=>`<li>${p}</li>`).join('')}</ul>
    <p class="txt">${T.sum}</p><p class="sec">飲み会でのあなた</p><p class="txt">${T.party}</p>
    <div class="sw"><div><p class="sec">強み</p><ul>${w.map(x=>`<li>${x[0]}</li>`).join('')}</ul></div><div><p class="sec">気をつけたいところ</p><ul>${w.map(x=>`<li>${x[1]}</li>`).join('')}</ul></div></div>
    <p class="match">相性のいいタイプ:<a href="#t${MATCH(i)}">${TYPES[MATCH(i)].n}</a></p><p class="word">${T.word}</p></div></article>`}).join('')}</section>`).join('')}
  <h2>最後の一枚(大事にしているもの)</h2><p class="sub">最後まで手放さなかった札が、証券の「大事にしているもの」になります。札は21枚あり、1回のゲームでは7枚を使います。</p>
  <div class="cardlist">${ALL.map((c,i)=>`<div class="cl"><div>${card(i)}</div><div><h4>${c.n}</h4><p>${c.pro}</p><p class="care2">取扱注意:${c.care}</p></div></div>`).join('')}</div>
  <p class="foot">判定の基準は、遊んだ結果を見て調整することがあります。</p>`;
  app.innerHTML=`<div class="screen">${H}</div>`;
  if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),50)}
}

/* ================= 入口 ================= */
function landing(){
  const go=u=>{location.href=u};homeBtn.hidden=true;guideBtn.target='_self';
  /* 途中のゲームがテレビ側に保存されていれば、続きから開けるようにする */
  let resume=null;try{let best=0;for(let k=0;k<localStorage.length;k++){const key=localStorage.key(k);if(!key.startsWith('saigo-host-'))continue;const sv=JSON.parse(localStorage.getItem(key));if(sv&&!['lobby','results'].includes(sv.phase)&&Date.now()-sv.savedAt<6*3600e3&&sv.savedAt>best){best=sv.savedAt;resume=sv.code}}}catch(e){}
  app.innerHTML=`<div class="screen"><div class="fan" aria-hidden="true">${CARDS.map((c,i)=>card(i)).join('')}</div><h1>最後の一枚</h1><p class="sub">7枚の価値観を1枚ずつ手放し、最後に残った1枚で本性を診断します。3〜7人で遊べます。</p>
  <button class="go" data-act="host">テレビで部屋を作る</button>
  <h2>スマホで参加</h2><label for="cd">部屋コード(4文字)</label><input id="cd" class="field code" maxlength="4" autocomplete="off" autocapitalize="characters"><button class="plain" data-act="join" style="margin-top:12px">参加する</button>
  ${resume?`<p style="margin-top:14px"><button class="plain" data-act="resume">テレビで続きから(部屋 ${esc(resume)})</button></p>`:''}
  <h2>ひとりで試す</h2><p class="sub">CPUを相手に、テレビも通信も使わずに遊べます。</p><button class="plain" data-act="test">CPUと遊ぶ</button>
  <h2>診断の解説</h2><p class="sub">16のタイプと、最後の一枚になる21枚の札の意味を読めます。</p><button class="plain" data-act="guide">解説を読む</button>${modeNote()}</div>`;
  app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const u=new URL(location.href);u.search='';
    if(b.dataset.act==='host'){u.searchParams.set('host','new');go(u)}
    else if(b.dataset.act==='test'){u.searchParams.set('test','1');go(u)}
    else if(b.dataset.act==='guide'){u.searchParams.set('guide','1');go(u)}
    else if(b.dataset.act==='resume'){u.searchParams.set('host',resume);if(params.get('local')==='1')u.searchParams.set('local','1');go(u)}
    else{const v=document.getElementById('cd').value.trim().toUpperCase();if(v.length!==4){document.getElementById('cd').focus();return}u.searchParams.set('room',v);go(u)}});
}
const fanFix=()=>document.querySelectorAll('.fan .cd').forEach((el,i)=>{el.style.transform=`rotate(${(i-3)*11}deg)`});
new MutationObserver(fanFix).observe(app,{childList:true,subtree:true});
if(params.get('guide')){guidePage()}
else if(params.get('test')){const mem=memTransport();hostMain({mem});playerMain('TEST',{mem})}
else if(params.get('host'))hostMain();else if(params.get('room'))playerMain(params.get('room').toUpperCase().slice(0,4));else landing();
}

</script>
